 const nodeWorkspace=<><div className="hero"><div><div className="eyebrow">Distributed infrastructure</div><h2>Nodes</h2><p>Each floor is an independent bridge. Select a node to see its sensors and test its communication paths.</p></div></div><div className="node-workspace">{nodes.map(n=>{const ss=sensors.filter(s=>String(s.floor)===String(n.floor));const a=ss.some(s=>health(s)==='alarm'),w=!a&&ss.some(s=>health(s)==='warning'),tone=a?'alarm':w?'warning':'normal';return <article className={'node-shell '+tone} key={n.node_id}><div className="node-head"><div><div className="node-title">Node {n.floor} · {n.node_id}</div><div className="node-subtitle">Bridge status: {n.status||'online'} · {ss.length} sensor channels · {n.summaries||0} summaries saved</div></div><span className={'node-state '+(tone==='alarm'?'red':tone==='warning'?'yellow':'green')}>● {label(tone)}</span></div><div className="node-body"><div><div className="node-sensors">{ss.map((s,i)=><React.Fragment key={i}>{sensorCard(s)}</React.Fragment>)}</div><div className="node-metrics"><span>Raw readings processed in memory</span><span>Summaries retained locally</span></div></div><div className="node-controls"><h4>Node controls</h4><p>These commands affect only this bridge and make the resilience test visible.</p><div className="button-row"><Button kind="green" onClick={()=>call({action:'bridge',target:n.node_id,value:true})}>Bridge up</Button><Button kind="red" onClick={()=>call({action:'bridge',target:n.node_id,value:false})}>Bridge down</Button><Button kind="green" onClick={()=>call({action:'lora',target:n.node_id,value:true})}>LoRa up</Button><Button kind="red" onClick={()=>call({action:'lora',target:n.node_id,value:false})}>LoRa down</Button></div><hr style={{borderColor:'var(--line)',borderWidth:'1px 0 0',margin:'15px 0'}}/><h4>Sensor test</h4><p>Generate a controlled ADXL355 anomaly on this node.</p><div className="button-row"><Button kind="yellow" onClick={()=>call({action:'anomaly',target:n.node_id,sensor:'accelerometer',value:true})}>ADXL alarm</Button><Button onClick={()=>call({action:'anomaly',target:n.node_id,sensor:'accelerometer',value:false})}>Clear</Button></div></div></div></article>})}</div><div className="card shared-control"><div className="head"><h3>Shared network path</h3><span>{control?'Control channel connected':'Waiting for simulator control'}</span></div><p style={{color:'var(--muted)',marginTop:0}}>This is the normal route shared by both bridges. If it goes down, each node can be observed switching to LoRa independently.</p><div className="button-row"><Button kind="green" onClick={()=>call({action:'network',value:true})}>Network up</Button><Button kind="yellow" onClick={()=>call({action:'network',value:false})}>Network down</Button></div></div></>;
 const incident=(s)=>{let st=health(s),[v,u]=reading(s);return <div className="incident"><div className="incident-head"><span>{s.measurement_type} · {s.node}</span><span className={'tag '+st}>{label(st)}</span></div><p>{s.sensor_model} reported <b>{typeof v==='number'?v.toFixed(2):v} {u}</b> on floor {s.floor}.</p></div>}

rol"><h4>Sensor scenario</h4><p>Inject a controlled abnormal value for testing.</p><div className="button-row"><Button kind="yellow" onClick={()=>call({action:'anomaly',target:'NODE-FLOOR-1',sensor:'accelerometer',value:true})}>ADXL alarm</Button><Button onClick={()=>call({action:'anomaly',target:'NODE-FLOOR-1',sensor:'accelerometer',value:false})}>Clear</Button></div></div></div></div>;
 const overview=<><div className="hero"><div><div className="eyebrow">First things first</div><h2>What is happening now?</h2><p>Emergency state and sensor health come first. Technical evidence is below.</p></div><div className="refresh">Last refresh<br/><b>{fmt(state?.updated_at)}</b></div></div><div className={'notice '+(alarms.length?'alarm':warnings.length?'warning':'')}><div><b>{alarms.length?'Active alarm requires attention':warnings.length?'Sensor warning needs review':'System operating normally'}</b><small>{alarms.length?'Open the sensor view and inspect the affected floor.':warnings.length?'A value is close to its configured limit.':'All current sensor values are inside the expected range.'}</small></div><Button kind="green" onClick={()=>setView('emergencies')}>Open emergencies</Button></div><div className="kpis"><div className="card kpi"><label>Active alarms</label><strong className="red">{alarms.length}</strong><small>Require attention</small></div><div className="card kpi"><label>Warnings</label><strong className="yellow">{warnings.length}</strong><small>Near configured limits</small></div><div className="card kpi"><label>Healthy sensors</label><strong className="green">{normal.length}</strong><small>Inside expected range</small></div><div className="card kpi"><label>Pending queue</label><strong className="yellow">{state?.counts?.pending??'—'}</strong><small>Waiting for backend acknowledgement</small></div></div><div className="grid"><div className="card"><div className="head"><h3>Building status</h3><span>Two independent bridges</span></div><div className="floors">{floor(1)}{floor(2)}</div></div><div className="card"><div className="head"><h3>Active incidents</h3><span>{alarms.length+warnings.length||'No'} active</span></div><div className="incidents">{[...alarms,...warnings].map((s,i)=>h('div',{key:i},incident(s)))}{!alarms.length&&!warnings.length&&<div className="incident"><p>No active alarms. All reported sensors are inside the expected range.</p></div>}</div></div></div><div className="card section"><div className="head"><h3>Sensor health</h3><span>Normal, warning and alarm</span></div><div className="sensor-grid">{sensors.map((s,i)=>h('div',{key:i},sensorCard(s)))}</div></div>{controls}</>;

 const flowView=<><div className="hero"><div><div className="eyebrow">Evidence</div><h2>Data flow</h2><p>Raw readings are transient; summaries and synchronization records persist locally.</p></div></div><div className="card"><div className="flow">{[['accelerometer-sensor.gif','Virtual sensors'],['message.gif','Bridge nodes'],['cloud-network.gif','LoRa fallback'],['database-table.gif','SQLite summaries'],['message.gif','REST backend']].map(x=><div className="flow-item" key={x[1]}><div className="flow-icon"><img src={'/assets/'+x[0]}/></div><span>{x[1]}</span></div>)}</div><pre className="code">{JSON.stringify(state?.latest_payload||{},null,2)}</pre></div></>;
 return <div className="app"><aside className="side"><div className="brand"><b>SUCCESS</b><span>SENTINEL BUILDING<br/>SIMULATION CONTROL</span></div><div className="nav"><div className="group">Operations</div>{[['overview','Overview'],['nodes','Nodes'],['sensors','Sensors'],['emergencies','Emergencies']].map(x=><button className={view===x[0]?'active':''} onClick={()=>setView(x[0])} key={x[0]}>{x[1]} {x[0]==='emergencies'&&alarms.length?` ${alarms.length}`:''}</button>)}<div className="group">Evidence</div>{[['flow','Data flow'],['events','Event history']].map(x=><button className={view===x[0]?'active':''} onClick={()=>setView(x[0])} key={x[0]}>{x[1]}</button>)}</div><div className="side-foot">Local React dashboard<br/>Simulator v2 · SB-001</div></aside><main className="main"><header className="top"><div><h1>Operational console</h1><p>Current state of the building, nodes and sensors.</p></div><div className="badges"><div className="badge"><span className="dot"></span><b>{state?'LIVE':'OFFLINE'}</b></div><div className="badge">Building <b>SB-001</b></div></div></header><section className={'view '+(view==='overview'?'active':'')}>{overview}</section><section className={'view '+(view==='nodes'?'active':'')}>{nodesView}</section><section className={'view '+(view==='sensors'?'active':'')}>{sensorsView}</section><section className={'view '+(view==='emergencies'?'active':'')}><div className="hero"><div><div className="eyebrow">Priority view</div><h2>Emergencies</h2><p>Use this view when a sensor goes outside its expected range.</p></div></div><div className="card"><div className="incidents">{alarms.map((s,i)=>h('div',{key:i},incident(s)))}{!alarms.length&&<div className="incident"><p>No active emergencies.</p></div>}</div></div></section><section className={'view '+(view==='flow'?'active':'')}>{flowView}</section><section className={'view '+(view==='events'?'active':'')}><div className="hero"><div><div className="eyebrow">Evidence</div><h2>Event history</h2><p>Recent synchronization and delivery actions.</p></div></div><div className="card"><div className="events">{(state?.logs||[]).map((l,i)=><div className="event" key={i}><time>{fmt(l.created_at)}</time><span className={l.result==='retry'?'red':'green'}>{l.result}</span><detail>{l.node_code} · {l.transport} · {l.message_uid}</detail></div>)}</div></div></section></main>{toast&&<div className="toast">{toast}</div>}</div>
}
function AppV3(){
 const [view,setView]=useState('overview'),[state,setState]=useState(null),[control,setControl]=useState(null),[toast,setToast]=useState(''),[tests,setTests]=useState([]),[testing,setTesting]=useState(false),[selectedNode,setSelectedNode]=useState(null);
 const sensors=state?.sensors||[],allNodes=state?.nodes||[],nodes=selectedNode?allNodes.filter(n=>String(n.floor)===String(selectedNode)):allNodes;
 const alarms=sensors.filter(s=>health(s)==='alarm'),warnings=sensors.filter(s=>health(s)==='warning'),normal=sensors.filter(s=>health(s)==='normal');
 const refresh=async()=>{try{const a=await fetch('/api/state',{cache:'no-store'}),nextState=await a.json();const b=await fetch('/api/control/status',{cache:'no-store'}),nextControl=await b.json();setState(nextState);setControl(nextControl);return {state:nextState,control:nextControl}}catch(e){setState(null);throw e}};
 const call=async(body)=>{try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();setToast(d.ok?'Command sent':'Control unavailable');setTimeout(()=>setToast(''),1800);refresh()}catch(e){setToast('Start the simulator first');setTimeout(()=>setToast(''),2200)}};
 const runTest=async(name,body,check)=>{setTesting(true);setTests(x=>[{name,status:'RUNNING',detail:'Executing scenario and observing system state…'},...x].slice(0,10));try{const commands=body?(Array.isArray(body)?body:[body]):[];for(const command of commands){const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(command)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.detail||'Command rejected')}if(commands.length)await new Promise(r=>setTimeout(r,350));const snapshot=await refresh();const verdict=check?check(snapshot):{ok:true,detail:'Expected state observed'};const ok=typeof verdict==='boolean'?verdict:Boolean(verdict.ok),detail=typeof verdict==='boolean'?(verdict?'Expected state observed':'Expected state was not observed'):(verdict.detail||'Verification completed');setTests(x=>x.map((t,i)=>i===0?{...t,name,status:ok?'PASS':'FAIL',detail}:t));}catch(e){setTests(x=>x.map((t,i)=>i===0?{...t,name,status:'FAIL',detail:e.message||'Simulator control channel unavailable'}:t))}finally{setTesting(false)}};

ns,100);ReactDOM.createRoot(document.getElementById('root')).render(<AppV3/>);
function mount3DBuilding(){const workspace=document.querySelector('.view.active .node-workspace'),existing=document.querySelector('.building-3d-card');if(!workspace||workspace.querySelectorAll('.node-shell').length!==1){if(existing)existing.remove();return}const nodeTitle=workspace.querySelector('.node-title')?.textContent||'',node=nodeTitle.includes('Node 2')?'2':'1';if(existing?.dataset.node===node)return;if(existing)existing.remove();const card=document.createElement('div');card.className='card building-3d-card';card.dataset.node=node;card.innerHTML=`<div class="building-3d-head"><div><h3>Interactive building model · Node ${node}</h3><p>Floor ${node} context · live sensor coverage · web-optimized GLB</p></div><span class="building-3d-badge">3D MODEL · CC0</span></div><div class="building-3d-stage"><model-viewer id="building-model-node-${node}" src="/assets/two-storey-cutaway-home.glb" camera-controls auto-rotate auto-rotate-delay="1200" rotation-per-second="16deg" shadow-intensity="1" exposure="1.05" camera-orbit="35deg 68deg 14m" interaction-prompt="none" alt="Interactive building model for node ${node}"></model-viewer><div class="building-3d-overlay"><div class="building-3d-legend"><span><i></i>Node ${node} · normal</span><span><i class="yellow"></i>Click and drag to inspect</span></div><div class="building-3d-note">FLOOR 0${node} · SENSOR COVERAGE</div></div></div><div class="building-3d-actions" style="margin-top:10px"><button class="btn" data-camera="35deg 68deg 14m">Overview</button><button class="btn" data-camera="0deg 82deg 10m">Front</button><button class="btn" data-camera="90deg 72deg 11m">Side</button></div>`;workspace.parentElement.insertBefore(card,workspace);card.querySelectorAll('[data-camera]').forEach(button=>button.addEventListener('click',()=>{const viewer=card.querySelector('model-viewer');viewer.cameraOrbit=button.dataset.camera;viewer.jumpCameraToGoal()}))}const modelObserver=new MutationObserver(mount3DBuilding);modelObserver.observe(document.getElementById('root'),{subtree:true,childList:true,characterData:true});setTimeout(mount3DBuilding,250);

<script>
(function(){
  const storageKey='sentinel-active-emergencies-v1';
  let clocks={};
  try{clocks=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){clocks={}}
  const save=()=>localStorage.setItem(storageKey,JSON.stringify(clocks));
  const incidentKey=card=>{
    const title=card.querySelector('.incident-head span:first-child')?.textContent?.trim()||'Unknown sensor';
    const model=(card.querySelector('p')?.textContent||'').split(' reported ')[0].trim();
    return title+' · '+model;
  };
  const sensorKey=card=>{
    const type=card.querySelector('.sensor-name')?.textContent?.trim()||'Unknown sensor';
    const node=(card.querySelector('.location')?.textContent||'Unknown node').split('·')[0].trim();
    const model=card.querySelector('.model')?.textContent?.trim()||'';
    return type+' · '+node+' · '+model;
  };
  const duration=ms=>{const total=Math.max(0,Math.floor(ms/1000)),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')};
  const clockTime=value=>new Date(value).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const fullTime=value=>new Date(value).toLocaleString([], {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  function updateEmergencyClocks(){
    const alarmOn=document.body.classList.contains('alarm-active');
    const cards=[...document.querySelectorAll('.incident')].filter(card=>card.querySelector('.tag.alarm'));
    const alarmSensors=[...document.querySelectorAll('.sensor.alarm')];
    const now=Date.now();
    if(!alarmOn){
      if(Object.keys(clocks).length){clocks={};save()}
      document.querySelectorAll('.emergency-summary').forEach(el=>el.remove());
      return;
    }
    const visibleKeys=[...new Set([...cards.map(incidentKey),...alarmSensors.map(sensorKey)])];
    visibleKeys.forEach(key=>{
      if(!clocks[key])clocks[key]={startedAt:now,lastSeenAt:now};
      clocks[key].lastSeenAt=now;
    });
    cards.forEach(card=>{
      const key=incidentKey(card);
      let panel=card.querySelector('.emergency-timing');
      if(!panel){panel=document.createElement('div');panel.className='emergency-timing';card.appendChild(panel)}
      panel.innerHTML='<span>Emergency started<b>'+fullTime(clocks[key].startedAt)+'</b></span><span class="elapsed">Elapsed time<b>'+duration(now-clocks[key].startedAt)+'</b></span><span>Last observed<b>'+clockTime(clocks[key].lastSeenAt)+'</b></span>';
    });
    if(visibleKeys.length){Object.keys(clocks).forEach(key=>{if(!visibleKeys.includes(key))delete clocks[key]})}
    save();
    const records=Object.values(clocks);
    const notice=document.querySelector('.notice.alarm > div:first-child');
    if(notice&&records.length){
      const oldest=Math.min(...records.map(record=>record.startedAt));
      let summary=notice.querySelector('.emergency-summary');
      if(!summary){summary=document.createElement('div');summary.className='emergency-summary';notice.appendChild(summary)}
      summary.innerHTML='<span>Started: <strong>'+fullTime(oldest)+'</strong></span><span>Elapsed: <strong>'+duration(now-oldest)+'</strong></span>';
    }
  }
  setInterval(updateEmergencyClocks,1000);
  setTimeout(updateEmergencyClocks,400);
})();
</script>
