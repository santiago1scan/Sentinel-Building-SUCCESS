services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sentinel-mosquitto
    restart: unless-stopped
    # Solo MQTT sobre TLS. No se publica el 1883: el broker no escucha en claro.
    # Antes de levantarlo: backend/mosquitto/gen-certs.sh y backend/mosquitto/init.sh (ver su README).
    ports:
      - "8883:8883"
    volumes:
      - ./backend/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./backend/mosquitto/data:/mosquitto/data
      - ./backend/mosquitto/certs:/mosquitto/certs:ro
    networks:
      - sentinel-net
    healthcheck:
      # Con allow_anonymous false un cliente sin credenciales no puede suscribirse: se comprueba el puerto.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: success_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  monolito-escucha:
    build:
      context: ./backend/monolito-escucha
      dockerfile: Dockerfile
    container_name: monolito_escucha
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENV: development
      # Cuenta del consumidor en el broker (se crea con provision_consumer; ver backend/mosquitto/README.md).
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_TLS: "true"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_USERNAME: ${MQTT_CONSUMER_USERNAME:-escucha-consumer}
      MQTT_PASSWORD: ${MQTT_CONSUMER_PASSWORD:?Define MQTT_CONSUMER_PASSWORD en el .env de la raíz}
      # Stream de alertas (/alerts/stream) y marcado como atendida: ID token de Firebase.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_ADMIN_EMAILS: ${FIREBASE_ADMIN_EMAILS:-}
    ports:
      - "8089:8089"
    volumes:
      - ./backend/monolito-escucha:/app
      - ./backend/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - sentinel-net
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8089 --reload"

  monolito-consulta:
    build:
      context: ./backend/monolito-consulta
      dockerfile: Dockerfile
    image: sentinel-monolito-consulta:latest
    container_name: monolito_consulta
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENV: development
      # Cuenta de administración del broker: crea y deshabilita los clientes de nodo.
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_TLS: "true"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_ADMIN_USERNAME: admin
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Define MQTT_ADMIN_PASSWORD en el .env de la raíz}
      BUILDING_CODE: SB-001
      # Autenticación del panel: se verifica el ID token de Firebase contra el id del proyecto.
      # Sin FIREBASE_PROJECT_ID las rutas de administración responden 503 (no quedan abiertas).
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_ADMIN_EMAILS: ${FIREBASE_ADMIN_EMAILS:-}
    ports:
      - "8090:8089"
    volumes:
      - ./backend/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - sentinel-net
    # Sin "alembic upgrade head": escucha ya versiona la BD compartida (alembic_version).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8089

  bridge:
    # Monolito del bridge (FastAPI, 3 capas). Equivale a bridge_service.py con la misma lógica.
    build:
      context: ./simulator/bridge
      dockerfile: Dockerfile
    container_name: sentinel-bridge
    restart: unless-stopped
    ports:
      - "8766:8766"
    networks:
      - sentinel-net
    volumes:
      - bridge_data:/app/data_bridge
      - ./backend/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    environment:
      # Tokens por nodo: "NODE-FLOOR-1=token1,NODE-FLOOR-2=token2" (definir en .env de la raíz)
      SENTINEL_NODE_TOKENS: ${SENTINEL_NODE_TOKENS:-}
      SENTINEL_DATA_DIR: /app/data_bridge
      SENTINEL_BUILDING_CODE: SB-001
      # Único nodo de este bridge: las gráficas de la página de inicio muestran sus lecturas.
      SENTINEL_NODE_CODE: NODE-FLOOR-1
      # Backend de consulta: ahí se registra el nodo desde la página /perfil.
      SENTINEL_CONSULTA_URL: http://monolito-consulta:8089
      SENTINEL_INTERVAL: "30"
      SENTINEL_API_URL: http://monolito-escucha:8089
      SENTINEL_API_PATH: /telemetry/aggregate
      # Broker dynamic-security: solo TLS en 8883. Cada nodo se autentica con su token.
      SENTINEL_MQTT_HOST: mosquitto
      SENTINEL_MQTT_PORT: "8883"
      SENTINEL_MQTT_TLS: "true"
      SENTINEL_MQTT_CA_FILE: /certs/ca.crt
      # Login de Firebase de la página /login (valores públicos del proyecto; ver .env.example).
      SENTINEL_FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      SENTINEL_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      SENTINEL_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SENTINEL_FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      SENTINEL_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      SENTINEL_FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      SENTINEL_FIREBASE_ADMIN_EMAILS: ${FIREBASE_ADMIN_EMAILS:-}
    depends_on:
      monolito-escucha:
        condition: service_started
      mosquitto:
        condition: service_healthy

  # Simulador de sensores (monolito FastAPI en simulator/simulator). Usa el mismo Dockerfile
  # del simulador. Su única conexión es el bridge. Panel en http://localhost:8790
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: sentinel-simulator
    restart: unless-stopped
    ports:
      - "8790:8790"
    networks:
      - sentinel-net
    depends_on:
      bridge:
        condition: service_started
    command: uvicorn app.main:app --app-dir /app/simulator --host 0.0.0.0 --port 8790
    environment:
      PYTHONUNBUFFERED: "1"
      SENTINEL_BRIDGE_URL: http://bridge:8766
      SENTINEL_INTERVAL: "30"
      SENTINEL_SIM_NODES: NODE-FLOOR-1,NODE-FLOOR-2
      # Arranca el ciclo de lecturas solo, como el simulador anterior.
      SENTINEL_AUTOSTART: "true"

  # Pruebas de integración: simulador → bridge → escucha, verificadas con consulta.
  # No se levanta con `up`. Ejecutar con:
  #   docker compose --profile test run --rm integration-tests
  # ATENCIÓN: escribe lecturas reales en la BD `success`.
  integration-tests:
    profiles: ["test"]
    build:
      context: ./backend/monolito-escucha
      dockerfile: Dockerfile
    container_name: sentinel-integration-tests
    networks:
      - sentinel-net
    volumes:
      - ./backend/monolito-escucha:/app
      - ./simulator:/simulator:ro
    depends_on:
      monolito-escucha:
        condition: service_started
      monolito-consulta:
        condition: service_started
      bridge:
        condition: service_started
    environment:
      RUN_INTEGRATION: "1"
      INTEGRATION_ESCUCHA_URL: http://monolito-escucha:8089
      INTEGRATION_CONSULTA_URL: http://monolito-consulta:8089
      INTEGRATION_BRIDGE_URL: http://bridge:8766
      # ID token de Firebase vigente: consulta protege /nodes y /readings.
      INTEGRATION_FIREBASE_ID_TOKEN: ${INTEGRATION_FIREBASE_ID_TOKEN:-}
      INTEGRATION_SIMULATOR_DIR: /simulator
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install -q -r requirements-dev.txt && pytest tests/integration -v"

volumes:
  postgres_data:
  bridge_data:

networks:
  sentinel-net:
    driver: bridge
