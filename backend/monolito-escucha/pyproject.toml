[project]
name = "monolito-escucha"
version = "0.1.0"
description = "Monolito de escucha para lecturas y alertas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.34.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.29.*",
    "alembic==1.13.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.5.*",
    "python-dotenv==1.0.*",
    "sqlacodegen==3.0.*",
    "email-validator==2.3.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==6.0.*",
    "httpx==0.27.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"app/models/*.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false