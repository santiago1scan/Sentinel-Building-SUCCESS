# Broker Sentinel: autenticación y permisos por nodo con el plugin dynamic-security
# (incluido en la imagen oficial eclipse-mosquitto:2.0, versión 2.0.x), solo sobre TLS.
#
# Los clientes (nodos, consumidor de escucha, administrador) se crean en el broker
# con `createClient` y reciben un rol con su ACL. Ver README.md de esta carpeta.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
# Registra conexiones y desconexiones, incluidos los intentos rechazados (credencial inválida,
# revocada o fallo de TLS). Es la evidencia de los rechazos de autenticación.
connection_messages true

# Un solo conjunto de reglas para todos los listeners.
per_listener_settings false
allow_anonymous false

# Único listener: MQTT sobre TLS. No hay puerto 1883 en claro, de modo que el token del nodo
# nunca viaja sin cifrar. Los certificados los genera gen-certs.sh y se montan en /mosquitto/certs.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
